[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdice-emulator"
version = "0.1.0"
description = "A reimplementation of the Q-DICE distributed quantum interconnect compiler and emulator methodology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michael Silver, Zachary Vernec, Hans-Arno Jacobsen" }
]
keywords = [
    "quantum computing",
    "distributed quantum computing",
    "qiskit",
    "quantum networking",
    "quantum simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Repository = "https://github.com/MSRG/Q-DICE"
Issues = "https://github.com/MSRG/Q-DICE/issues"

[tool.setuptools.packages.find]
include = ["qdice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
